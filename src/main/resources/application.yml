spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/proofoffunds
    username: proofoffunds
    password: proofoffunds
  jpa:
    hibernate:
      ddl-auto: validate   # el esquema lo maneja Flyway, no Hibernate
    show-sql: true
  flyway:
    enabled: true
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60
  cors:
    allowed-origins: http://localhost:4200